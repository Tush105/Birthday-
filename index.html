<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love 💖</title>
    <style>
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background-color: #ffdeeb; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; flex-direction: column; }
        .container { text-align: center; z-index: 10; max-width: 600px; width: 90%; padding: 20px; margin: 20px 0; }
        .box-wrapper { position: relative; display: inline-block; transition: transform 0.3s; cursor: pointer; padding: 20px; }
        .box-wrapper:hover { transform: scale(1.05); }
        .love-box { font-size: 100px; animation: bounce 2s infinite; }
        .click-text { font-size: 1.5rem; color: #d63384; font-weight: bold; margin-top: 15px; }
        .cake-stage, .letter-stage { display: none; }
        .cake { font-size: 120px; position: relative; display: inline-block; }
        .candle { font-size: 40px; position: absolute; top: -25px; left: 50%; transform: translateX(-50%); }
        .flame { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 25px; animation: flicker 0.5s infinite alternate; }
        .blow-btn { background: #ff477e; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 25px; }
        .letter-stage { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px; border: 2px solid #ffb7df; }
        .birthday-wish { color: #d63384; font-size: 2.3rem; margin-bottom: 25px; font-weight: bold; }
        .love-letter { font-size: 1.15rem; line-height: 1.8; color: #4a4a4a; text-align: left; white-space: pre-line; user-select: text; }
        .signature { text-align: right; font-weight: bold; color: #d63384; font-size: 1.3rem; margin-top: 20px; }
        .dashboard { margin-top: 25px; display: flex; flex-direction: column; gap: 15px; }
        .watch-box { background: linear-gradient(135deg, #fff0f6, #ffdeeb); border: 2px solid #ffb7df; border-radius: 15px; padding: 15px; }
        .watch-title { font-size: 1rem; color: #c71585; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .time-display { font-size: 1.15rem; color: #4a4a4a; font-weight: 600; }
        .minutes-total { font-size: 0.9rem; color: #d63384; margin-top: 5px; font-weight: bold; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-20px); } 60% { transform: translateY(-10px); } }
        @keyframes flicker { 0% { transform: translateX(-50%) scale(1); } 100% { transform: translateX(-50%) scale(1.1) rotate(2deg); } }
    </style>
</head>
<body>
    <audio id="birthdayMusic" loop>
        <source src="https://mixkit.co" type="audio/wav">
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>
    <div class="container">
        <div id="stage-box" class="box-wrapper" onclick="openBox()">
            <div class="love-box">🎁❤️</div>
            <div class="click-text">Click My Wifey ✨</div>
        </div>
        <div id="stage-cake" class="cake-stage">
            <div class="cake">
                <div id="flame" class="flame">🔥</div>
                <div id="candle" class="candle">🕯️</div>🎂
            </div><br>
            <button class="blow-btn" onclick="blowCandle()">Make a Wish & Blow 🌬️</button>
        </div>
        <div id="stage-letter" class="letter-stage">
            <div class="birthday-wish">Happy Birthday Eraboti Rahman 👑🎀</div>
            <div class="love-letter">My dearest Wifey, ... [সম্পূর্ণ চিঠি দেখতে মূল কোডটি ব্যবহার করুন]</div>
            <div class="signature">Forever yours.. Tush 🩷</div>
            <div class="dashboard">
                <div class="watch-box">
                    <div id="watch1-title" class="watch-title">Wifey's Age Watch 🕒</div>
                    <div id="watch1-display" class="time-display">Loading...</div>
                    <div id="watch1-minutes" class="minutes-total"></div>
                </div>
                <div class="watch-box">
                    <div class="watch-title">Our Happy Married Life 💞</div>
                    <div id="watch2-display" class="time-display">Loading...</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function openBox() {
            document.getElementById('stage-box').style.display = 'none';
            document.getElementById('stage-cake').style.display = 'block';
            document.getElementById('birthdayMusic').play().catch(() => {});
        }
        function blowCandle() {
            document.getElementById('flame').style.display = 'none';
            document.getElementById('candle').innerText = '💨';
            setTimeout(() => {
                document.getElementById('stage-cake').style.display = 'none';
                document.getElementById('stage-letter').style.display = 'block';
                setInterval(updateWatches, 1000);
                updateWatches();
            }, 1000);
        }
        function updateWatches() {
            const now = new Date();
            const bDate = new Date(2005, 9, 15);
            const mDate = new Date(2025, 0, 6);
            let currentYear = now.getFullYear();
            let thisBirthday = new Date(currentYear, 9, 15, 0, 0, 0);
            let birthdayEnd = new Date(currentYear, 9, 15, 23, 59, 59);

            if (now >= thisBirthday && now <= birthdayEnd) {
                document.getElementById('watch1-title').innerText = "Wifey's Beautiful Age Watch 🕒";
                let ageDiff = now - bDate;
                let totalMinutes = Math.floor(ageDiff / (1000 * 60));
                let years = now.getFullYear() - bDate.getFullYear();
                document.getElementById('watch1-display').innerHTML = years + " Years... ✨";
                document.getElementById('watch1-minutes').innerHTML = "Total passed: " + totalMinutes.toLocaleString() + " minutes";
            } else {
                document.getElementById('watch1-title').innerText = "Next Birthday Countdown ⏳";
                document.getElementById('watch1-minutes').innerHTML = "";
                document.getElementById('watch1-display').innerHTML = "Countdown running...";
            }
            let marriageDiff = now - mDate;
            let mDays = Math.floor(marriageDiff / (1000 * 60 * 60 * 24));
            document.getElementById('watch2-display').innerHTML = mDays + " Days passed";
        }
    </script>
</body>
</html>
